# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Build performance:
#  - parallel: independent project builds run concurrently (safe; we have one
#    app module today, but enables future modularisation without retuning).
#  - caching: reuses task outputs across builds (Kotlin compile, R8, AAPT2).
#  - configureondemand: only configures projects in the current task graph.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin code style — required so the Kotlin Gradle plugin stops emitting a
# warning about the unset preference on every build.
kotlin.code.style=official

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enable New Architecture
newArchEnabled=true

# ABIs to build.
#
# Default `armeabi-v7a,arm64-v8a,x86,x86_64` builds a "fat" APK roughly 4×
# the size of an arm64-only build. For Play Store distribution use App
# Bundles (`./gradlew bundleRelease`) which produce per-ABI splits
# automatically.
#
# For local testing, override per-task:
#   ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
#
# We keep all four here so emulator users (x86_64) and physical devices
# (arm64-v8a) both work out of the box without needing the property.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true
